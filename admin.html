<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<title>Admin – Room Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="room-status.css">
<style>
:root{color-scheme:light;--ink:#12202f;--mut:#566474;--paper:#f4f6f8;--card:#fff;--bd:#d9e0e7;--pri:#0e5a8a;--pri-d:#0a4568;--saf:#8a5a00;--saf-bg:#fff2d4;--bad:#a52a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 "Mukta",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
header{background:var(--ink);color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:60px;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.1rem}.brand small{font-weight:400;color:#9fb3c5;margin-left:8px}
.who{display:flex;gap:10px;align-items:center;font-size:.9rem;color:#c9d6e2}
.who a{color:#fff}
input,select{padding:10px 12px;border:1px solid var(--bd);border-radius:7px;background:#fff;color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid #7fb4d8;outline-offset:1px}
button,.btn{background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:7px;padding:8px 14px;font:600 .92rem "Mukta",sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
button:hover{background:var(--pri-d)}button:disabled{opacity:.6}
.ghost{background:#fff;color:var(--pri);border-color:var(--bd)}.ghost:hover{background:#eef3f7}
.danger{background:#fff;color:var(--bad);border-color:#e5c3c3}.danger:hover{background:#fbeeee}
.hide{display:none!important}
.center{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:28px}
.center h1{font-size:1.3rem;margin:0 0 6px}.center p{color:var(--mut);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0 16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:1.5rem;line-height:1.2}.stat span{color:var(--mut);font-size:.88rem}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;color:var(--mut);border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 14px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--pri)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.tools input{flex:1 1 220px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:.9rem}
.tag{display:inline-block;font-size:.8rem;background:#eef2f6;color:#33414f;border-radius:5px;padding:1px 8px;margin:3px 6px 3px 0}
.feat{background:var(--saf-bg);color:var(--saf);font-weight:600}
.item label{display:block;margin:10px 0 4px;font-size:.9rem;color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#note{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw}
</style>
</head>
<body>
<section id="s_loading" class="center"><p>लोड होत आहे…</p></section>
<section id="s_login" class="center hide">
  <h1>Admin login</h1><p>हे पान फक्त अधिकृत व्यवस्थापकांसाठी आहे. तुमच्या Google खात्याने login करा.</p>
  <button id="loginBtn">Google ने login करा</button>
</section>
<section id="s_denied" class="center hide">
  <h1>प्रवेश नाही</h1><p><span id="deniedWho"></span> या खात्याला admin अधिकार नाहीत. योग्य खात्याने login करा.</p>
  <button class="ghost" id="logoutBtn2">Logout</button> <a class="btn ghost" href="./">वेबसाइटवर जा</a>
</section>
<div id="s_app" class="hide">
  <header><div class="wrap bar">
    <div class="brand"><span data-brand>Room Finder</span><small>Admin</small></div>
    <div class="who"><span id="who"></span><a href="./">वेबसाइट पहा</a><button class="ghost" id="logoutBtn">Logout</button></div>
  </div></header>
  <main class="wrap">
    <div class="stats" id="stats"></div>
    <div class="tabs" role="tablist">
      <button id="t_req" class="on">Featured विनंत्या</button>
      <button id="t_rooms">सर्व रूम</button>
      <button id="t_status">Room Status</button>
      <button id="t_payment">Payment Settings</button>
      <button id="t_rep">तक्रारी</button>
      <button id="t_fee">शुल्क</button>
    </div>
    <div id="tools" class="tools hide">
      <input id="aq" placeholder="शहर, एरिया, मालकाचे नाव किंवा नंबर शोधा" aria-label="शोध">
      <select id="af" aria-label="स्थिती"><option value="all">सर्व</option><option value="featured">Featured</option><option value="hidden">लपवलेल्या</option><option value="rented">भाड्याने गेलेल्या</option></select>
    </div>
    <div id="status-tools" class="tools hide">
      <input id="statusSearch" placeholder="शहर किंवा एरिया शोधा" aria-label="Room शोध">
      <select id="statusFilter" aria-label="Room status"><option value="all">All Rooms</option><option value="available">Available Rooms</option><option value="rented">Rented Rooms</option><option value="inactive">Inactive Rooms</option></select>
    </div>
    <div id="list"></div>
  </main>
</div>
<div id="note" class="hide" role="alert"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
<script src="admin-status-payment.js"></script>
</body>
</html>
